<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#070b14" id="themeMeta" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="微信待办" />
  <link rel="manifest" href="/manifest.webmanifest" />
  <link rel="icon" type="image/svg+xml" href="/icon.svg" />
  <link rel="apple-touch-icon" href="/icon.svg" />
  <title>微信实时待办 · 手机同步</title>
  <style>
    :root {
      --bg-canvas: #070b14;
      --glass-bg: rgba(15, 23, 42, 0.76);
      --glass-strong: rgba(15, 23, 42, 0.9);
      --card-bg: rgba(24, 34, 54, 0.78);
      --glass-border: rgba(255, 255, 255, 0.09);
      --glass-highlight: inset 0 1px 0 rgba(255, 255, 255, 0.07);
      --text-primary: #f1f5f9;
      --text-secondary: #9fb0c9;
      --text-muted: #6c7f9c;
      --accent: #07c160;
      --accent-rgb: 7, 193, 96;
      --accent-2: #06b6d4;
      --red: #f43f5e;
      --amber: #f59e0b;
      --shadow: 0 16px 38px rgba(2, 6, 23, 0.45);
      --ease-spring: cubic-bezier(0.34, 1.36, 0.64, 1);
      --ease-smooth: cubic-bezier(0.22, 1, 0.36, 1);
    }

    :root[data-theme="light"] {
      --bg-canvas: #eff4f9;
      --glass-bg: rgba(255, 255, 255, 0.84);
      --glass-strong: rgba(255, 255, 255, 0.94);
      --card-bg: rgba(255, 255, 255, 0.9);
      --glass-border: rgba(15, 23, 42, 0.08);
      --glass-highlight: inset 0 1px 0 rgba(255, 255, 255, 0.95);
      --text-primary: #0f172a;
      --text-secondary: #475569;
      --text-muted: #7c8da6;
      --accent: #07b85b;
      --accent-rgb: 7, 184, 91;
      --shadow: 0 14px 34px rgba(15, 23, 42, 0.09);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Segoe UI Variable", "Microsoft YaHei UI", sans-serif;
      background: var(--bg-canvas);
      color: var(--text-primary);
      min-height: 100dvh;
      overflow-x: hidden;
      -webkit-font-smoothing: antialiased;
      padding: env(safe-area-inset-top) 0 calc(28px + env(safe-area-inset-bottom));
    }

    /* Ambient Aurora */
    .aurora {
      position: fixed; inset: 0; pointer-events: none; z-index: 0; overflow: hidden;
    }
    .orb {
      position: absolute; border-radius: 50%; filter: blur(78px); opacity: 0.32;
      will-change: transform;
    }
    .orb-1 {
      width: 340px; height: 340px; top: -120px; left: -90px;
      background: radial-gradient(circle, rgba(7, 193, 96, 0.6), transparent 70%);
      animation: drift1 16s ease-in-out infinite alternate;
    }
    .orb-2 {
      width: 320px; height: 320px; right: -110px; top: 24%;
      background: radial-gradient(circle, rgba(6, 182, 212, 0.48), transparent 70%);
      animation: drift2 20s ease-in-out infinite alternate;
    }
    .orb-3 {
      width: 300px; height: 300px; bottom: -120px; left: 18%;
      background: radial-gradient(circle, rgba(99, 102, 241, 0.36), transparent 70%);
      animation: drift3 24s ease-in-out infinite alternate;
    }
    :root[data-theme="light"] .orb { opacity: 0.2; }
    @keyframes drift1 { to { transform: translate3d(50px, 40px, 0) scale(1.14); } }
    @keyframes drift2 { to { transform: translate3d(-45px, 60px, 0) scale(1.12); } }
    @keyframes drift3 { to { transform: translate3d(40px, -45px, 0) scale(1.1); } }

    .wrap {
      position: relative; z-index: 1;
      max-width: 560px; margin: 0 auto; padding: 14px 16px 24px;
    }

    /* Lock Gate */
    .lock-screen {
      min-height: calc(100dvh - 60px);
      display: flex; align-items: center; justify-content: center; padding: 20px 8px;
    }
    .lock-card {
      width: 100%; max-width: 380px;
      background: var(--glass-strong);
      backdrop-filter: blur(24px) saturate(165%);
      -webkit-backdrop-filter: blur(24px) saturate(165%);
      border: 1px solid var(--glass-border);
      border-radius: 24px; padding: 30px 24px;
      box-shadow: var(--shadow), var(--glass-highlight);
      text-align: center;
      animation: popIn 0.45s var(--ease-spring);
    }
    .lock-icon {
      width: 62px; height: 62px; margin: 0 auto 16px; border-radius: 18px;
      background: linear-gradient(135deg, #07c160, #06b6d4);
      display: flex; align-items: center; justify-content: center;
      color: #fff; box-shadow: 0 10px 28px rgba(7, 193, 96, 0.38);
    }
    .lock-title { font-size: 20px; font-weight: 800; margin-bottom: 6px; }
    .lock-sub { font-size: 13px; color: var(--text-secondary); line-height: 1.55; margin-bottom: 20px; }
    .lock-input {
      width: 100%; padding: 13px 16px; font-size: 16px;
      border-radius: 14px; border: 1px solid var(--glass-border);
      background: var(--card-bg); color: var(--text-primary);
      outline: none; margin-bottom: 12px;
      transition: border-color 0.2s, box-shadow 0.2s;
    }
    .lock-input:focus {
      border-color: rgba(var(--accent-rgb), 0.75);
      box-shadow: 0 0 0 3px rgba(var(--accent-rgb), 0.18);
    }
    .lock-btn {
      width: 100%; padding: 13px; border: none; border-radius: 14px;
      background: linear-gradient(135deg, #07c160, #10b981);
      color: #fff; font-size: 15px; font-weight: 700; cursor: pointer;
      box-shadow: 0 8px 22px rgba(7, 193, 96, 0.35);
      transition: transform 0.2s var(--ease-spring);
    }
    .lock-btn:active { transform: scale(0.97); }
    .lock-err { margin-top: 10px; font-size: 12.5px; color: #fb7185; min-height: 18px; }

    /* Main App */
    .hidden { display: none !important; }

    .topbar {
      display: flex; align-items: center; justify-content: space-between;
      margin-bottom: 14px; padding: 4px 2px;
    }
    .brand { display: flex; align-items: center; gap: 10px; }
    .brand-icon {
      width: 38px; height: 38px; border-radius: 12px;
      background: linear-gradient(135deg, #07c160 0%, #10b981 55%, #06b6d4 100%);
      display: flex; align-items: center; justify-content: center; color: #fff;
      box-shadow: 0 6px 18px rgba(7, 193, 96, 0.35);
    }
    .brand-name { font-size: 17px; font-weight: 800; letter-spacing: -0.01em; }
    .brand-sub { font-size: 11px; color: var(--text-muted); display: flex; align-items: center; gap: 6px; margin-top: 1px; }
    .live-dot {
      position: relative; width: 7px; height: 7px; border-radius: 50%;
      background: #10b981; display: inline-block;
      box-shadow: 0 0 8px rgba(16, 185, 129, 0.8);
    }
    .live-dot::after {
      content: ""; position: absolute; inset: -4px; border-radius: 50%;
      border: 1.5px solid rgba(16, 185, 129, 0.7);
      animation: pulse 2.2s ease-out infinite;
    }
    @keyframes pulse { 0% { transform: scale(0.75); opacity: 0.9; } 100% { transform: scale(2.2); opacity: 0; } }

    .top-actions { display: flex; gap: 8px; }
    .circle-btn {
      width: 38px; height: 38px; border-radius: 12px;
      background: var(--glass-bg); border: 1px solid var(--glass-border);
      backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
      color: var(--text-secondary); cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      box-shadow: var(--glass-highlight);
      transition: transform 0.22s var(--ease-spring), color 0.2s, border-color 0.2s;
    }
    .circle-btn:active { transform: scale(0.92); }
    .circle-btn.spinning svg { animation: spin 0.75s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* Hero Progress Card */
    .hero {
      background: linear-gradient(135deg, rgba(7, 38, 42, 0.88), rgba(14, 34, 58, 0.86));
      backdrop-filter: blur(22px) saturate(160%);
      -webkit-backdrop-filter: blur(22px) saturate(160%);
      border: 1px solid rgba(255, 255, 255, 0.11);
      border-radius: 22px; padding: 18px 18px 16px;
      box-shadow: var(--shadow), inset 0 1px 0 rgba(255, 255, 255, 0.12);
      margin-bottom: 14px;
      animation: popIn 0.4s var(--ease-smooth);
    }
    :root[data-theme="light"] .hero {
      background: linear-gradient(135deg, rgba(236, 253, 245, 0.92), rgba(224, 242, 254, 0.9));
      border-color: rgba(7, 193, 96, 0.22);
    }
    .hero-top { display: flex; align-items: center; gap: 16px; }
    .ring-wrap {
      position: relative; width: 68px; height: 68px; flex-shrink: 0;
      display: flex; align-items: center; justify-content: center;
    }
    .ring-svg { width: 68px; height: 68px; transform: rotate(-90deg); }
    .ring-track { fill: none; stroke: rgba(148, 163, 184, 0.22); stroke-width: 6; }
    .ring-fill {
      fill: none; stroke: #07c160; stroke-width: 6; stroke-linecap: round;
      transition: stroke-dashoffset 0.65s var(--ease-smooth);
      filter: drop-shadow(0 0 6px rgba(7, 193, 96, 0.55));
    }
    .ring-pct { position: absolute; font-size: 14px; font-weight: 800; }
    .hero-info { flex: 1; min-width: 0; }
    .hero-title { font-size: 16px; font-weight: 800; margin-bottom: 4px; }
    .hero-nums { display: flex; gap: 12px; font-size: 12.5px; color: var(--text-secondary); flex-wrap: wrap; }
    .hero-nums b { color: var(--text-primary); }
    .hero-nums .hi { color: #fb7185; }
    :root[data-theme="light"] .hero-nums .hi { color: #e11d48; }
    .sync-banner {
      margin-top: 12px; padding-top: 10px;
      border-top: 1px solid var(--glass-border);
      font-size: 11.5px; color: var(--text-secondary); line-height: 1.45;
      display: flex; align-items: flex-start; gap: 7px;
    }

    /* Quick Add Card */
    .add-card {
      background: var(--glass-bg);
      backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
      border: 1px solid var(--glass-border);
      border-radius: 18px; padding: 12px;
      box-shadow: var(--glass-highlight);
      margin-bottom: 14px;
    }
    .add-row { display: flex; gap: 8px; }
    .add-input {
      flex: 1; min-width: 0; font-size: 16px; padding: 10px 13px;
      border-radius: 12px; border: 1px solid var(--glass-border);
      background: var(--card-bg); color: var(--text-primary); outline: none;
    }
    .add-input:focus { border-color: rgba(var(--accent-rgb), 0.7); box-shadow: 0 0 0 3px rgba(var(--accent-rgb), 0.14); }
    .add-btn {
      padding: 0 18px; border: none; border-radius: 12px;
      background: linear-gradient(135deg, #07c160, #10b981);
      color: #fff; font-size: 14px; font-weight: 700; cursor: pointer;
      box-shadow: 0 4px 14px rgba(7, 193, 96, 0.34);
      flex-shrink: 0; transition: transform 0.2s var(--ease-spring);
    }
    .add-btn:active { transform: scale(0.94); }
    .add-opts { display: flex; gap: 8px; margin-top: 8px; align-items: center; }
    .prio-toggle {
      padding: 5px 11px; border-radius: 999px; font-size: 12px; font-weight: 600;
      border: 1px solid var(--glass-border); background: var(--card-bg); color: var(--text-secondary);
      cursor: pointer; transition: all 0.2s;
    }
    .prio-toggle.active {
      background: rgba(244, 63, 94, 0.16); color: #fb7185; border-color: rgba(244, 63, 94, 0.38);
    }
    .dl-input {
      flex: 1; font-size: 13px; padding: 5px 10px; border-radius: 999px;
      border: 1px solid var(--glass-border); background: var(--card-bg);
      color: var(--text-primary); outline: none;
    }

    /* Filter Chips */
    .filters {
      display: flex; gap: 8px; overflow-x: auto; padding-bottom: 4px; margin-bottom: 12px;
      scrollbar-width: none;
    }
    .filters::-webkit-scrollbar { display: none; }
    .chip {
      flex-shrink: 0; padding: 7px 14px; border-radius: 999px;
      border: 1px solid var(--glass-border); background: var(--glass-bg);
      color: var(--text-secondary); font-size: 13px; font-weight: 600;
      cursor: pointer; display: inline-flex; align-items: center; gap: 6px;
      transition: all 0.22s var(--ease-spring);
    }
    .chip.active {
      background: linear-gradient(135deg, #07c160, #10b981);
      color: #fff; border-color: transparent;
      box-shadow: 0 5px 14px rgba(7, 193, 96, 0.34);
    }
    .chip-cnt {
      font-size: 11px; padding: 1px 7px; border-radius: 999px;
      background: rgba(148, 163, 184, 0.18);
    }
    .chip.active .chip-cnt { background: rgba(0, 0, 0, 0.22); }

    /* Task Cards */
    .task-list { display: flex; flex-direction: column; gap: 10px; }
    .task-card {
      background: var(--glass-bg);
      backdrop-filter: blur(18px); -webkit-backdrop-filter: blur(18px);
      border: 1px solid var(--glass-border);
      border-radius: 17px; padding: 14px;
      box-shadow: var(--glass-highlight), 0 6px 18px rgba(2, 6, 23, 0.12);
      display: flex; gap: 12px; align-items: flex-start;
      transition: transform 0.22s var(--ease-spring), opacity 0.25s ease, border-color 0.2s;
      animation: cardIn 0.32s var(--ease-smooth) both;
    }
    .task-card.done { opacity: 0.58; }
    .task-card.done .task-title { text-decoration: line-through; color: var(--text-muted); }
    @keyframes cardIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    @keyframes popIn { from { opacity: 0; transform: scale(0.95) translateY(8px); } to { opacity: 1; transform: scale(1) translateY(0); } }

    /* Custom Animated Checkbox */
    .chk-wrap {
      position: relative; width: 24px; height: 24px; margin-top: 1px; flex-shrink: 0; cursor: pointer;
    }
    .chk-wrap input { position: absolute; opacity: 0; inset: 0; width: 100%; height: 100%; cursor: pointer; z-index: 2; }
    .chk-box {
      width: 24px; height: 24px; border-radius: 8px;
      border: 2px solid rgba(148, 163, 184, 0.5);
      background: rgba(15, 23, 42, 0.22);
      display: flex; align-items: center; justify-content: center;
      transition: all 0.26s var(--ease-spring);
    }
    :root[data-theme="light"] .chk-box { background: rgba(255, 255, 255, 0.9); }
    .chk-box svg {
      width: 14px; height: 14px; stroke: #fff; stroke-width: 2.8;
      stroke-linecap: round; stroke-linejoin: round; fill: none;
      stroke-dasharray: 24; stroke-dashoffset: 24; opacity: 0; transform: scale(0.55);
      transition: stroke-dashoffset 0.28s var(--ease-smooth) 0.04s, opacity 0.16s, transform 0.26s var(--ease-spring);
    }
    .chk-wrap input:checked + .chk-box {
      background: linear-gradient(135deg, #07c160, #10b981);
      border-color: transparent; box-shadow: 0 4px 14px rgba(7, 193, 96, 0.45);
      transform: scale(1.05);
    }
    .chk-wrap input:checked + .chk-box svg { stroke-dashoffset: 0; opacity: 1; transform: scale(1); }

    .task-body { flex: 1; min-width: 0; }
    .task-title { font-size: 15px; font-weight: 700; line-height: 1.4; word-break: break-word; }
    .task-detail { font-size: 12.5px; color: var(--text-secondary); margin-top: 5px; line-height: 1.5; word-break: break-word; }
    .task-meta { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 9px; }
    .tag {
      padding: 2px 8px; border-radius: 7px; font-size: 11px; font-weight: 600;
      background: rgba(14, 165, 233, 0.14); color: #38bdf8;
      border: 1px solid rgba(14, 165, 233, 0.22);
    }
    :root[data-theme="light"] .tag { color: #0284c7; }
    .tag.high { background: rgba(244, 63, 94, 0.15); color: #fb7185; border-color: rgba(244, 63, 94, 0.26); }
    :root[data-theme="light"] .tag.high { color: #e11d48; }
    .tag.dl { background: rgba(245, 158, 11, 0.16); color: #fbbf24; border-color: rgba(245, 158, 11, 0.26); }
    :root[data-theme="light"] .tag.dl { color: #b45309; }

    .del-btn {
      background: none; border: none; color: var(--text-muted);
      font-size: 18px; padding: 4px 6px; border-radius: 8px; cursor: pointer; line-height: 1;
    }
    .del-btn:active { color: #f43f5e; background: rgba(244, 63, 94, 0.14); }

    .empty {
      text-align: center; padding: 48px 16px; color: var(--text-secondary); font-size: 14px;
    }
    .empty-emoji { font-size: 42px; margin-bottom: 10px; }

    .footer-bar {
      display: flex; justify-content: space-between; align-items: center;
      margin-top: 18px; padding: 10px 4px; font-size: 12px; color: var(--text-muted);
    }
    .foot-btn {
      background: var(--glass-bg); border: 1px solid var(--glass-border);
      color: var(--text-secondary); padding: 6px 12px; border-radius: 10px;
      font-size: 12px; cursor: pointer;
    }

    /* Confetti */
    .confetti {
      position: fixed; width: 7px; height: 7px; pointer-events: none; z-index: 9999;
      animation: fly 0.7s cubic-bezier(0.16, 0.84, 0.44, 1) forwards;
    }
    @keyframes fly {
      0% { opacity: 1; transform: translate3d(0,0,0) scale(1) rotate(0deg); }
      100% { opacity: 0; transform: translate3d(var(--tx), var(--ty), 0) scale(0.35) rotate(var(--rot)); }
    }

    /* Toast */
    .toast {
      position: fixed; top: calc(14px + env(safe-area-inset-top)); left: 50%;
      transform: translateX(-50%); z-index: 9998;
      background: linear-gradient(135deg, rgba(7, 193, 96, 0.94), rgba(5, 150, 105, 0.94));
      color: #fff; font-size: 13px; font-weight: 600; padding: 9px 18px;
      border-radius: 999px; box-shadow: 0 10px 26px rgba(0, 0, 0, 0.32);
      animation: popIn 0.3s var(--ease-spring);
    }
  </style>
</head>
<body>
  <div class="aurora" aria-hidden="true">
    <div class="orb orb-1"></div>
    <div class="orb orb-2"></div>
    <div class="orb orb-3"></div>
  </div>

  <div class="wrap">
    <!-- Lock Screen -->
    <section id="lockScreen" class="lock-screen hidden">
      <div class="lock-card">
        <div class="lock-icon">
          <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect width="18" height="11" x="3" y="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
        </div>
        <div class="lock-title">微信实时待办 · 安全验证</div>
        <div class="lock-sub">此网址仅同步个人待办清单（不暴露任何微信聊天记录）。请输入专属访问口令或通过电脑端专属链接打开。</div>
        <input id="tokenInput" class="lock-input" type="password" placeholder="输入专属访问口令..." autocomplete="off" />
        <button id="unlockBtn" class="lock-btn">解锁进入</button>
        <div id="lockErr" class="lock-err"></div>
      </div>
    </section>

    <!-- Main Mobile App -->
    <main id="appMain" class="hidden">
      <header class="topbar">
        <div class="brand">
          <div class="brand-icon">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>
          </div>
          <div>
            <div class="brand-name">微信实时待办</div>
            <div class="brand-sub"><span class="live-dot"></span><span id="syncStatusText">实时与电脑双向同步</span></div>
          </div>
        </div>
        <div class="top-actions">
          <button class="circle-btn" id="refreshBtn" title="立即同步" aria-label="刷新">
            <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 0 0-9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/><path d="M3 12a9 9 0 0 0 9 9 9.75 9.75 0 0 0 6.74-2.74L21 16"/><path d="M16 16h5v5"/></svg>
          </button>
          <button class="circle-btn" id="themeBtn" title="切换深浅色" aria-label="切换主题">
            <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/></svg>
          </button>
        </div>
      </header>

      <section class="hero">
        <div class="hero-top">
          <div class="ring-wrap">
            <svg class="ring-svg" viewBox="0 0 72 72">
              <circle class="ring-track" cx="36" cy="36" r="29"></circle>
              <circle class="ring-fill" id="ringFill" cx="36" cy="36" r="29" stroke-dasharray="182.21" stroke-dashoffset="182.21"></circle>
            </svg>
            <span class="ring-pct" id="ringPct">0%</span>
          </div>
          <div class="hero-info">
            <div class="hero-title" id="heroHeadline">今天也要稳稳推进 ✨</div>
            <div class="hero-nums">
              <span>待办 <b id="cntTodo">0</b></span>
              <span>高优 <b class="hi" id="cntHigh">0</b></span>
              <span>已完成 <b id="cntDone">0</b></span>
            </div>
          </div>
        </div>
        <div class="sync-banner" id="syncBanner">
          <span class="live-dot" style="margin-top:5px;flex-shrink:0"></span>
          <span>正在连接电脑端待办库...</span>
        </div>
      </section>

      <section class="add-card">
        <div class="add-row">
          <input id="newTitle" class="add-input" placeholder="记一条新待办，自动同步回电脑..." />
          <button id="addBtn" class="add-btn">添加</button>
        </div>
        <div class="add-opts">
          <button type="button" id="prioBtn" class="prio-toggle">⚡ 高优</button>
          <input id="newDeadline" class="dl-input" placeholder="可选截止时间，如：明晚 20:00" />
        </div>
      </section>

      <nav class="filters" id="filterBar">
        <button class="chip active" data-filter="todo">待办 <span class="chip-cnt" id="fTodo">0</span></button>
        <button class="chip" data-filter="all">全部 <span class="chip-cnt" id="fAll">0</span></button>
        <button class="chip" data-filter="high">高优 <span class="chip-cnt" id="fHigh">0</span></button>
        <button class="chip" data-filter="done">已完成 <span class="chip-cnt" id="fDone">0</span></button>
      </nav>

      <section id="taskList" class="task-list"></section>

      <footer class="footer-bar">
        <span id="lastSyncClock">隐私保护：仅同步待办</span>
        <button class="foot-btn" id="clearDoneBtn">清理已完成</button>
      </footer>
    </main>
  </div>

  <script>
  (function () {
    const INITIAL_AUTH = __INITIAL_AUTH__;
    const RING_CIRC = 2 * Math.PI * 29;
    let isAuthed = INITIAL_AUTH;
    let currentFilter = 'todo';
    let addHigh = false;
    let stateData = null;

    const $ = (id) => document.getElementById(id);
    const esc = (s) => String(s || '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');

    function toast(msg) {
      const el = document.createElement('div');
      el.className = 'toast';
      el.textContent = msg;
      document.body.appendChild(el);
      setTimeout(() => el.remove(), 2200);
    }

    function burst(x, y) {
      const colors = ['#07c160', '#34d399', '#38bdf8', '#fbbf24', '#a78bfa', '#fb7185'];
      for (let i = 0; i < 14; i++) {
        const p = document.createElement('span');
        p.className = 'confetti';
        const a = (Math.PI * 2 * i) / 14 + (Math.random() - 0.5) * 0.4;
        const d = 28 + Math.random() * 44;
        p.style.left = (x - 3.5) + 'px';
        p.style.top = (y - 3.5) + 'px';
        p.style.background = colors[i % colors.length];
        p.style.borderRadius = i % 3 === 0 ? '50%' : '2px';
        p.style.setProperty('--tx', (Math.cos(a) * d).toFixed(1) + 'px');
        p.style.setProperty('--ty', (Math.sin(a) * d - 14).toFixed(1) + 'px');
        p.style.setProperty('--rot', ((Math.random() - 0.5) * 480).toFixed(0) + 'deg');
        document.body.appendChild(p);
        setTimeout(() => p.remove(), 740);
      }
    }

    function applyTheme(t) {
      if (t === 'light') {
        document.documentElement.setAttribute('data-theme', 'light');
        $('themeMeta').setAttribute('content', '#eff4f9');
      } else {
        document.documentElement.removeAttribute('data-theme');
        $('themeMeta').setAttribute('content', '#070b14');
      }
      localStorage.setItem('wcb_mobile_theme', t || 'dark');
    }
    applyTheme(localStorage.getItem('wcb_mobile_theme') || 'dark');

    $('themeBtn').onclick = () => {
      const isLight = document.documentElement.getAttribute('data-theme') === 'light';
      applyTheme(isLight ? 'dark' : 'light');
    };

    function showView(authed) {
      isAuthed = authed;
      $('lockScreen').classList.toggle('hidden', authed);
      $('appMain').classList.toggle('hidden', !authed);
    }

    function render() {
      if (!stateData) return;
      const tasks = stateData.tasks || [];
      const c = stateData.counts || { todo: 0, done: 0, high: 0, total: 0 };
      const pct = c.total > 0 ? Math.round((c.done / c.total) * 100) : 0;

      $('ringFill').style.strokeDasharray = RING_CIRC.toFixed(2);
      $('ringFill').style.strokeDashoffset = (RING_CIRC * (1 - pct / 100)).toFixed(2);
      $('ringPct').textContent = pct + '%';
      $('cntTodo').textContent = c.todo;
      $('cntHigh').textContent = c.high;
      $('cntDone').textContent = c.done;
      $('fTodo').textContent = c.todo;
      $('fAll').textContent = c.total;
      $('fHigh').textContent = c.high;
      $('fDone').textContent = c.done;

      $('heroHeadline').textContent =
        c.todo === 0 ? '全部待办已清空 🎉' : (c.high > 0 ? `有 ${c.high} 项高优事项待处理` : `还有 ${c.todo} 项待办等待完成`);

      const logs = stateData.sync_logs || [];
      const bannerTxt = logs.length
        ? `每小时微信自动巡检 · ${String(logs[0].synced_at || '').slice(5, 16)}：${logs[0].summary || ''}`
        : '已开启微信每小时自动巡检，新待办会自动推送到这里';
      $('syncBanner').innerHTML = `<span class="live-dot" style="margin-top:5px;flex-shrink:0"></span><span>${esc(bannerTxt)}</span>`;
      $('lastSyncClock').textContent = `已同步 ${String(stateData.server_time || '').slice(11, 19)}`;

      let visible = tasks;
      if (currentFilter === 'todo') visible = tasks.filter((t) => t.status !== 'done');
      else if (currentFilter === 'done') visible = tasks.filter((t) => t.status === 'done');
      else if (currentFilter === 'high') visible = tasks.filter((t) => t.status !== 'done' && t.priority === 'high');

      if (!visible.length) {
        $('taskList').innerHTML = '<div class="empty"><div class="empty-emoji">✨</div><div>当前分类下暂无事项</div></div>';
        return;
      }

      $('taskList').innerHTML = visible.map((t, i) => {
        const done = t.status === 'done';
        const prio = t.priority === 'high' ? '<span class="tag high">高优</span>' : '';
        const dl = t.deadline ? `<span class="tag dl">⏰ ${esc(t.deadline)}</span>` : '';
        const src = t.source_title ? `<span class="tag">💬 ${esc(t.source_title)}</span>` : '';
        const detail = t.detail ? `<div class="task-detail">${esc(t.detail)}</div>` : '';
        const delay = Math.min(i, 8) * 28;
        return `<article class="task-card ${done ? 'done' : ''}" data-id="${t.id}" style="animation-delay:${delay}ms">
          <label class="chk-wrap">
            <input type="checkbox" class="t-chk" ${done ? 'checked' : ''} />
            <span class="chk-box"><svg viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"/></svg></span>
          </label>
          <div class="task-body">
            <div class="task-title">${esc(t.title)}</div>
            ${detail}
            <div class="task-meta">${prio}${dl}${src}</div>
          </div>
          <button class="del-btn" title="删除">×</button>
        </article>`;
      }).join('');
    }

    async function loadTasks(spin) {
      if (!isAuthed) return;
      const btn = $('refreshBtn');
      if (spin) btn.classList.add('spinning');
      try {
        const r = await fetch('/api/tasks', { credentials: 'same-origin' });
        if (r.status === 401) {
          showView(false);
          return;
        }
        if (!r.ok) return;
        stateData = await r.json();
        $('syncStatusText').textContent = '实时与电脑双向同步';
        render();
      } catch {
        $('syncStatusText').textContent = '连接电脑中，请确认电脑在线...';
      } finally {
        if (spin) setTimeout(() => btn.classList.remove('spinning'), 360);
      }
    }

    async function doUnlock() {
      const token = $('tokenInput').value.trim();
      $('lockErr').textContent = '';
      if (!token) { $('lockErr').textContent = '请输入访问口令'; return; }
      const r = await fetch('/api/auth', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        credentials: 'same-origin',
        body: JSON.stringify({ token }),
      });
      if (r.ok) {
        $('tokenInput').value = '';
        showView(true);
        await loadTasks(true);
      } else {
        const d = await r.json().catch(() => ({}));
        $('lockErr').textContent = d.error || '口令不正确';
      }
    }

    async function addTask() {
      const title = $('newTitle').value.trim();
      if (!title) return;
      const deadline = $('newDeadline').value.trim();
      $('newTitle').value = '';
      $('newDeadline').value = '';
      const r = await fetch('/api/tasks', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        credentials: 'same-origin',
        body: JSON.stringify({ title, deadline, priority: addHigh ? 'high' : 'normal', source_title: '手机端添加' }),
      });
      if (r.ok) {
        toast('已添加并同步至电脑');
        await loadTasks(false);
      }
    }

    $('unlockBtn').onclick = doUnlock;
    $('tokenInput').onkeydown = (e) => { if (e.key === 'Enter') doUnlock(); };
    $('refreshBtn').onclick = () => loadTasks(true);
    $('addBtn').onclick = addTask;
    $('newTitle').onkeydown = (e) => { if (e.key === 'Enter') addTask(); };
    $('prioBtn').onclick = () => {
      addHigh = !addHigh;
      $('prioBtn').classList.toggle('active', addHigh);
    };

    $('filterBar').addEventListener('click', (e) => {
      const chip = e.target.closest('.chip');
      if (!chip) return;
      currentFilter = chip.dataset.filter;
      document.querySelectorAll('.chip').forEach((el) => el.classList.toggle('active', el === chip));
      render();
    });

    $('taskList').addEventListener('change', async (e) => {
      if (!e.target.classList.contains('t-chk')) return;
      const card = e.target.closest('.task-card');
      const id = card?.dataset.id;
      if (!id) return;
      if (e.target.checked) {
        const rect = e.target.getBoundingClientRect();
        burst(rect.left + rect.width / 2, rect.top + rect.height / 2);
      }
      await fetch(`/api/tasks/${id}/toggle`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        credentials: 'same-origin',
        body: JSON.stringify({ done: e.target.checked }),
      });
      await loadTasks(false);
    });

    $('taskList').addEventListener('click', async (e) => {
      if (!e.target.classList.contains('del-btn')) return;
      const id = e.target.closest('.task-card')?.dataset.id;
      if (!id) return;
      await fetch(`/api/tasks/${id}`, { method: 'DELETE', credentials: 'same-origin' });
      toast('已删除');
      await loadTasks(false);
    });

    $('clearDoneBtn').onclick = async () => {
      await fetch('/api/tasks/clear-done', { method: 'POST', credentials: 'same-origin' });
      toast('已清理已完成事项');
      await loadTasks(false);
    };

    document.addEventListener('visibilitychange', () => {
      if (document.visibilityState === 'visible' && isAuthed) loadTasks(false);
    });

    showView(isAuthed);
    if (isAuthed) loadTasks(false);
    setInterval(() => { if (document.visibilityState === 'visible' && isAuthed) loadTasks(false); }, 10000);
  })();
  </script>
</body>
</html>
